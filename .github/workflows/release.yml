# Autonomous Engineering Platform - release pipeline for the React skill pack.
#
# Triggered by tag pushes (vX.Y.Z). Builds the pack tarball, verifies it
# is reproducible, publishes a GitHub Release with the tarball + SHA256SUMS,
# and then calls release-provenance.yml to attach a SLSA-style attestation.
#
# Permissions: contents:write (tag + release), id-token:write + attestations:write
# (provenance). Listed in security.yml's audit exception list.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build and publish (e.g. v1.2.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      ASSET_NAME: react-agent-skills-${{ inputs.version || github.ref_name }}.tar.gz
    steps:
      - name: Check release tag format
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "release tag must look like vX.Y.Z: $VERSION" >&2
            exit 1
          fi

      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate skill library
        run: node scripts/validate.mjs

      - name: Build reproducible release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --sort=name --mtime='2024-01-01 00:00:00 UTC' \
              --owner=0 --group=0 --numeric-owner \
              -czf "dist/$ASSET_NAME" \
              skills patterns evaluations benchmarks router \
              skill-manifest.yml AGENTS.md README.md LICENSE
          ( cd dist && sha256sum "$ASSET_NAME" > SHA256SUMS )

      - name: Verify archive reproducibility
        run: |
          set -euo pipefail
          first="$(sha256sum "dist/$ASSET_NAME" | awk '{print $1}')"
          rm "dist/$ASSET_NAME"
          tar --sort=name --mtime='2024-01-01 00:00:00 UTC' \
              --owner=0 --group=0 --numeric-owner \
              -czf "dist/$ASSET_NAME" \
              skills patterns evaluations benchmarks router \
              skill-manifest.yml AGENTS.md README.md LICENSE
          second="$(sha256sum "dist/$ASSET_NAME" | awk '{print $1}')"
          if [[ "$first" != "$second" ]]; then
            echo "release archive is not reproducible: $first != $second" >&2
            exit 1
          fi
          echo "release archive reproducible: $first"

      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<NOTES
          ## React Agent Skills $VERSION

          Reproducible skill pack tarball. See \`SHA256SUMS\` for the
          archive digest. Build provenance is attached under the
          release's **Attestations** tab; verify with:
          \`\`\`bash
          gh attestation verify "dist/$ASSET_NAME" --owner ${{ github.repository_owner }}
          \`\`\`
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$VERSION" =~ -(rc|beta|alpha|test)\.?[0-9]*$ ]]; then
            prerelease_args+=(--prerelease)
          fi
          assets=("dist/$ASSET_NAME" dist/SHA256SUMS)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --notes-file dist/release-notes.md
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "React Agent Skills $VERSION" \
              --notes-file dist/release-notes.md \
              "${prerelease_args[@]}"
          fi

  provenance:
    needs: release
    uses: ./.github/workflows/release-provenance.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      asset-name: react-agent-skills-${{ inputs.version || github.ref_name }}.tar.gz
