# MCP capability policy for this pack's future MCP server (none shipped yet).
# See mcp/README.md: the policy is defined before the server exists, so any
# server this pack later wires up must satisfy it. Tool names are classified
# explicitly from a trusted tools/list response; server-provided descriptions
# and annotations are never security policy. Fail-closed: a tool absent from
# the classifications below is denied.
#
# The pre-classified surface mirrors the read-only routing tools the family's
# reference implementation (node-agent-skills lib/mcp-server.mjs, pinned at
# v0.11.0) exposes. When this pack ships its own server, confirm each mapping
# against ITS live tools/list before enabling the profile.
schema_version: 1

defaults:
  unknown_tool: deny
  production: deny
  isolated_capabilities:
    - test_execution
    - debugger_control
    - arbitrary_code_execution
    - shell_execution
    - dependency_write
    - filesystem_write
    - database_write
    - external_network
    - database_admin_write
    - browser_automation_write
    - version_control_write
    - external_context_fetch

capability_aliases:
  pack_routing:
    - metadata_read
    - source_read

profiles:
  pack-read:
    allow:
      - metadata_read
      - source_read
    require_approval: []

servers:
  # Planned read-only routing surface for react-agent-skills. Mappings are
  # the intended classification; each must be confirmed against the server's
  # live tools/list when the server ships.
  react-agent-skills:
    tools:
      get_skill: source_read          # returns one SKILL.md's content
      route_prompt: source_read       # returns a routing decision derived from pack content
      route_cross_pack: source_read   # returns a cross-pack routing decision
      list_skills: metadata_read      # enumerates the manifest inventory
      list_adapters: metadata_read    # enumerates the adapter inventory (when this pack ships adapters)
